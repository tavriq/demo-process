name: demo-process

services:
  app:
    build: .
    image: demo-process:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:18106:8000"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    # Root filesystem is read-only; state lives in the volume, scratch space in /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    env_file:
      # LLM_API_KEY, LLM_BASE_URL: the server's shared gateway file, never printed.
      - path: ../llm.env
        required: false
    environment:
      EXTRACT_MODEL: "anthropic/claude-haiku-5-5"
      IMPROVE_MODEL: "anthropic/claude-haiku-5-5"
      # The interview (docs/SPEC-analyst.md): drafts and questions, speech to text.
      DRAFT_MODEL: "gemini/gemini-3.1-flash-lite"
      STT_MODEL: "openai/gpt-4o-transcribe"
      DAILY_BUDGET_RUB: "40"
      RUNS_PER_HOUR: "3"
      MAX_CONCURRENT_RUNS: "2"
      MAX_TEXT_CHARS: "1500"
      RUN_TIMEOUT_S: "120"
      RETENTION_DAYS: "30"
      # nginx on the host reaches the container through the docker bridge.
      TRUSTED_PROXY: "172.16.0.0/12"
      VAR_DIR: "/var/lib/demo-process"
    volumes:
      - demo-process-var:/var/lib/demo-process
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  demo-process-var:
